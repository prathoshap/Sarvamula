<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sarvamūla — Reader</title>
<style>
  /* ── palette ────────────────────────────────────────────────────────────────
     Colour carries meaning here, so each role gets ONE value and every rule refers to it
     by name. Before this there were 47 distinct hexes for 117 uses — three different reds
     doing the same job — which is why nothing read as a consistent signal.

       ink / ink2 / ink3   text, secondary, tertiary
       accent              anything you can act on (links, chapters, controls)
       deep                scripture and headings — mūla, sūtra, adhyāya titles
       gold                apparatus: references, durations, ornament
       cite                quoted pramāṇa
     Warm greys throughout: a neutral grey on cream paper reads cold and dirty. */
  :root{
    --bg:#fbf8f1; --card:#fffdf8; --line:#e8dcc7; --line-2:#f2e9d8;
    --ink:#2b2119; --ink2:#655a4c; --ink3:#93887a;
    --accent:#8b2410; --deep:#6a1a0a; --accent-soft:#faf1e6;
    --gold:#b0842c; --gold-soft:#f5ead2;
    --cite:#46662f; --cite-soft:#cfdcb4;
    --verse:#6b4a1e;        /* verse lines inside a tile: warm brown, NOT the scripture red —
                               they often sit on the pramāṇa panel, where red clashes */
    --chrome:rgba(253,250,244,.96);   /* header/now-bar wash — must track --bg */
    --read:19px;
    /* Devanāgarī by default; scripts with their own shipped face override it below. */
    --face:'SvDeva','Noto Serif Devanagari',Georgia,serif;
  }
  /* Brighter alternative, opt-in via the A☼ button. The reading surface is deliberately
     almost unchanged: body ink is already 14.8:1 on paper and that is what makes long
     reading comfortable. What was missing is luminance RANGE — the old accents were highly
     saturated (88-91%) but all dark, so everything sat in one narrow band and read as muddy,
     and page-vs-card was 1.02:1, no separation at all. So: lighter accents, a page a shade
     deeper than the card so tiles lift, and firmer rules. Every token here clears 4.5:1 on
     BOTH surfaces — gold and ink3 did not before (3.2:1 and 3.3:1), so this is brighter and
     more legible, not brighter at legibility's expense. */
  html[data-palette="bright"]{
    --bg:#f7f2e6; --card:#fffdf6; --line:#dcc7a4; --line-2:#eee2cb;
    --ink:#241b13; --ink2:#5d5245; --ink3:#726657;
    --accent:#b23a1d; --deep:#7d1f0c; --accent-soft:#fdf1e7;
    --gold:#8f6716; --gold-soft:#f7ecd4;
    --cite:#456d2f; --cite-soft:#d3e0b9;
    --verse:#7d5420;
    --chrome:rgba(249,245,235,.96);
  }
  html[data-script="te"]{--face:'SvTelugu','SvDeva',Georgia,serif;}
  html[data-script="ml"]{--face:'SvMlym','SvDeva',Georgia,serif;}
  html[data-script="bn"]{--face:'SvBeng','SvDeva',Georgia,serif;}
  html[data-script="gu"]{--face:'SvGujr','SvDeva',Georgia,serif;}
  html[data-script="kn"]{--face:'SvKnda','SvDeva',Georgia,serif;}
  html[data-script="ta"]{--face:'SvTaml','SvDeva',Georgia,serif;}
  html[data-script="pa"]{--face:'SvGuru','SvDeva',Georgia,serif;}
  html[data-script="or"]{--face:'SvOrya','SvDeva',Georgia,serif;}
  /* Devanāgarī is rendered from a font shipped WITH the reader, not from whatever the device
     happens to have. 41 KB subset of Noto Sans Devanagari — SIL Open Font License, notice kept
     inside — covering the Devanāgarī block, Vedic Extensions and Devanāgarī Extended, with its
     GSUB/GPOS intact so conjuncts form and marks position.

     One font for letters AND accents, deliberately. A Vedic mark the text font lacks does not
     merely box: the shaper fails on the whole cluster and takes neighbouring letters with it,
     which is why ऋ ग्भाष्य verses lost characters even with no webfont of mine involved. Split
     a cluster across two fonts and the same thing happens. Naming this first keeps every
     cluster inside one face.

     'Noto Serif Devanagari' led this stack for years and is not installed here — harmless
     until something with partial coverage sat behind it. */
  @font-face{
    font-family:'SvDeva';
    src:url('devanagari.woff2') format('woff2');
    font-display:block;
  }
  /* Malayalam and Bengali, same reason again: no installed face carries the Vedic marks, and
     a cluster may not span two fonts. Subsets of Noto Sans Malayalam / Bengali (SIL OFL); the
     marks each lacked — Bengali has no double svarita at all — were grafted in from the
     Devanāgarī face, which is the same Noto family and the same em size. */
  @font-face{
    font-family:'SvMlym';
    src:url('malayalam.woff2') format('woff2');
    font-display:block;
  }
  @font-face{
    font-family:'SvKnda';
    src:url('kannada.woff2') format('woff2');
    font-display:block;
  }
  @font-face{
    font-family:'SvTaml';
    src:url('tamil.woff2') format('woff2');
    font-display:block;
  }
  @font-face{
    font-family:'SvGuru';
    src:url('gurmukhi.woff2') format('woff2');
    font-display:block;
  }
  @font-face{
    font-family:'SvOrya';
    src:url('oriya.woff2') format('woff2');
    font-display:block;
  }
  @font-face{
    font-family:'SvGujr';
    src:url('gujarati.woff2') format('woff2');
    font-display:block;
  }
  @font-face{
    font-family:'SvBeng';
    src:url('bengali.woff2') format('woff2');
    font-display:block;
  }
  /* Telugu needs the same treatment for the same reason: no installed Telugu face carries the
     Vedic marks, and splitting a cluster between a Telugu font and a Devanāgarī one breaks the
     shaping exactly as it did for Devanāgarī. 46 KB subset of Noto Sans Telugu, SIL OFL. */
  @font-face{
    font-family:'SvTelugu';
    src:url('telugu.woff2') format('woff2');
    font-display:block;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--face);font-size:19px;line-height:1.75}
  header{position:sticky;top:0;background:var(--chrome);border-bottom:1px solid var(--line);
         padding:.6rem 1rem;padding-top:calc(.6rem + env(safe-area-inset-top));
         padding-left:calc(1rem + env(safe-area-inset-left));padding-right:calc(1rem + env(safe-area-inset-right));
         display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;z-index:9}
  header h1{font-size:1.18rem;margin:0 .4rem 0 0;color:var(--deep);cursor:pointer;white-space:nowrap;
           font-family:var(--face);letter-spacing:.01em}
  select,input{font:inherit;padding:.35rem .5rem;border:1px solid var(--line);border-radius:8px;background:var(--card)}
  input{flex:1;min-width:120px}
  .search-row{display:flex;gap:.3rem;align-items:center;flex:1}
  .search-btn{font:inherit;padding:.35rem .6rem;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer;color:var(--accent);font-weight:600}
  .search-btn:hover{border-color:var(--accent);background:var(--accent-soft)}
  .wrap{max-width:1360px;margin:0 auto;padding:1rem}
  /* reading-size control (topbar) */
  .fs{display:flex;gap:.25rem}
  .fs button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:8px;
             padding:.3rem .55rem;color:var(--ink);line-height:1}
  .fs button:hover{border-color:var(--accent);color:var(--accent)}
  /* by id, not :first/:last-child — the palette button is now last and was taking A+'s size */
  #fsDown{font-size:.85rem}#fsUp{font-size:1.05rem}
  #palBtn{font-size:1rem;color:var(--gold)}
  #palBtn.on{background:var(--gold-soft);border-color:var(--gold);color:var(--deep)}
  /* ---- opening page ----
     Same shape as Bhāgavata-VāNi's: the ācārya, the name, the invocation, then the reader
     chooses a script before entering. Shown once — the choice is remembered — and reachable
     afterwards as #/about. Colours come from this reader's own tokens, so it follows the
     palette toggle like everything else. */
  .welcome{max-width:560px;margin:0 auto;text-align:center;
    padding:calc(20px + env(safe-area-inset-top)) 16px calc(22px + env(safe-area-inset-bottom));
    min-height:calc(100dvh - 90px);display:flex;flex-direction:column;align-items:center}
  .welcome.about{display:block;min-height:auto;position:relative;padding-top:18px}
  .w-pic{width:148px;height:185px;object-fit:cover;object-position:50% 14%;border-radius:15px;
    border:1px solid var(--line);box-shadow:0 6px 26px #0004;margin-bottom:11px}
  .w-pic.small{width:116px;height:146px;box-shadow:0 5px 20px #0003}
  .w-title{color:var(--accent);font-size:35px;margin:2px 0 0;line-height:1.15;font-weight:600;
    font-family:var(--face)}
  .w-name{color:var(--ink);font-size:17px;font-weight:600;margin-top:1px}
  .w-script{color:var(--ink3);font-size:15px;margin-top:4px}
  .w-invoke{color:var(--accent);font-size:16px;margin:10px 0 4px}
  .w-credit{color:var(--ink3);font-size:12px;line-height:1.55}
  .w-tts{color:var(--ink3);font-size:12px;margin-top:7px}
  .w-credit a,.ack-section a,.w-tts a{color:var(--accent);text-decoration:none;font-weight:600}
  .w-prompt{color:var(--ink3);font-size:13px;margin:16px 0 10px}
  .scriptlist{width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:10px}
  @media(max-width:520px){.scriptlist{grid-template-columns:repeat(3,1fr)}}
  .scriptcard{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 5px;
    cursor:pointer;font-family:var(--face);transition:border-color .12s, box-shadow .15s}
  .scriptcard:hover{border-color:var(--accent);box-shadow:0 3px 14px #0001}
  .scriptcard:active{transform:scale(.98)}
  .sc-native{font-size:16px;color:var(--ink);line-height:1.2;overflow-wrap:anywhere}
  .sc-eng{font-size:10px;color:var(--ink3);line-height:1.15}
  .w-ack{margin-top:16px;color:var(--accent);font-size:13px;background:none;border:none;
    text-decoration:underline;cursor:pointer;font-family:inherit}
  .ack-section{margin:22px auto;max-width:430px}
  .ack-h{color:var(--accent);font-size:11px;letter-spacing:.09em;text-transform:uppercase;margin-bottom:9px}
  .ack-section p{color:var(--ink);font-size:15.5px;line-height:1.72;margin:0}
  .back-link{position:absolute;left:6px;top:10px;color:var(--accent);font-size:24px;
    background:none;border:none;cursor:pointer;line-height:1}
  .w-loading{color:var(--ink3);font-size:14px;padding:18px 0;text-align:center}
  /* ---- home hero: the ācārya and the tagline ----
     Centred as a frontispiece: the invocation reads first, the image sits beneath it. The
     painting is warm ochre on a dark ground, so it needs no card around it — a soft edge is
     enough on the cream page. */
  .hero{display:flex;flex-direction:column;align-items:center;text-align:center;
        margin:.4rem auto 1.7rem;padding-bottom:1.3rem;max-width:640px;
        border-bottom:2px solid var(--line)}
  .hero img{width:150px;height:auto;margin-top:1rem;border-radius:10px;border:1px solid var(--line);
            box-shadow:0 12px 30px -18px rgba(60,30,10,.55)}
  .hero-name{font-size:1.1rem;font-weight:700;color:var(--deep);line-height:1.45}
  .tag{font-size:1.42rem;color:var(--accent);margin:.5rem 0 .35rem;line-height:1.5;
       font-family:var(--face)}
  @media (max-width:640px){ .hero img{width:124px} .tag{font-size:1.15rem} }
  /* the hero is decoration — a printed grantha does not need it */
  @media print{ .hero{display:none} }
  /* Rows CENTRE, including short ones. As a grid with auto-fill 1fr tracks, a group of two
     — मूलग्रन्थाः — kept the two empty tracks on its right and read as left-aligned under a
     centred page. Flex-wrap has no phantom tracks, so every row centres on its own; the
     fixed basis keeps all tiles one width instead of stretching two of them across 1360px. */
  .works{display:flex;flex-wrap:wrap;justify-content:center;gap:.7rem}
  .works>.wcard{flex:0 1 248px;max-width:300px}
  /* prasthāna group headings on the home page */
  .grouphd{display:flex;align-items:baseline;gap:.7rem;flex-wrap:wrap;margin:1.7rem 0 .8rem;
           padding-bottom:.35rem;border-bottom:2px solid var(--line)}
  .grouphd:first-child{margin-top:.3rem}
  .grouphd .gt{font-size:1.35rem;font-weight:700;color:var(--deep)}
  .grouphd .ge{font-size:.82rem;color:var(--ink2);letter-spacing:.04em;text-transform:uppercase}
  .wcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.9rem 1rem;cursor:pointer;
         box-shadow:0 6px 18px -16px rgba(0,0,0,.4);transition:.12s;
         /* centred to sit under the centred frontispiece; the column also keeps the title and
            its counts optically stacked when a grantha name wraps to two lines */
         display:flex;flex-direction:column;justify-content:center;text-align:center}
  .wcard:hover{border-color:var(--accent);transform:translateY(-1px)}
  .wcard .t{font-weight:600;color:var(--deep)}
  .wcard .m{font-size:.8rem;color:var(--ink2);margin-top:.2rem}
  .v{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.7rem .95rem;margin:.55rem 0}
  .v.tat{background:var(--gold-soft);border-left:3px solid var(--gold)}
  .v.mula{border-left:3px solid var(--accent)}
  .v.mula .body{color:var(--deep);font-weight:600;font-size:calc(var(--read) * 1.07);letter-spacing:.01em}
  .v.mula .ref{color:var(--accent)}
  .body .quote{color:var(--cite);font-style:italic}          /* quoted pramāṇa (cited scripture) */
  /* pramāṇa quotations set on their own line, de-cluttered from Madhva's prose */
  .pram-q{display:block;color:var(--cite);margin:.4rem 0 .4rem 1.1rem;padding:.05rem 0 .05rem .75rem;
          border-left:2px solid var(--cite-soft);line-height:1.7}
  .body .cite{color:var(--gold);font-size:.9em;white-space:nowrap}  /* source reference */
  /* work title + topic outline */
  .wtitle{font-size:1.5rem;font-weight:700;color:var(--deep);margin:.4rem 0 .6rem}
  .outline{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.4rem .9rem;margin:0 0 1.2rem;
           box-shadow:0 6px 18px -16px rgba(0,0,0,.4)}
  .outline summary{cursor:pointer;font-weight:600;color:var(--accent);font-size:.95rem;padding:.35rem 0;letter-spacing:.02em}
  .oi{display:block;color:var(--ink2);text-decoration:none;padding:.14rem 0;font-size:.95rem;line-height:1.4}
  .oi:hover{color:var(--accent)}
  .oi.l0{font-weight:700;color:var(--deep);margin-top:.3rem}
  .oi.l1{font-weight:600;padding-left:.9rem}
  .oi.l2{padding-left:1.9rem}.oi.l3{padding-left:2.9rem;font-size:.9rem}.oi.l4{padding-left:3.9rem;font-size:.88rem;color:var(--ink3)}
  /* topic/section headers in the reading pane */
  .topic{color:var(--deep);font-weight:700;scroll-margin-top:64px}
  .topic.lv0{font-size:1.35rem;margin:1.8rem 0 .5rem;border-bottom:2px solid var(--line);padding-bottom:.2rem}
  .topic.lv1{font-size:1.2rem;margin:1.4rem 0 .4rem;color:var(--deep)}
  .topic.lv2{font-size:1.05rem;margin:1rem 0 .3rem;color:var(--accent)}
  .topic.lv3{font-size:.98rem;margin:.8rem 0 .25rem;color:var(--accent);font-weight:600}
  .topic.lv4{font-size:.94rem;margin:.6rem 0 .2rem;color:var(--gold);font-weight:600;font-style:italic}
  /* pramāṇa (quoted-authority) blocks + source tags + variants */
  .v.pram{background:transparent;border-left:3px solid var(--cite-soft);padding-left:.9rem}
  .v .src{color:var(--gold);font-size:.82rem;margin-top:.35rem;font-style:italic}
  .v .var{color:var(--ink3);font-size:.78rem;margin-top:.25rem;border-top:1px dashed var(--line);padding-top:.2rem}
  .v[id]{scroll-margin-top:64px}
  /* chapter navigator layout */
  .layout{display:flex;gap:1.4rem;align-items:flex-start}
  .nav{position:sticky;top:60px;width:210px;flex:0 0 210px;max-height:calc(100vh - 76px);overflow:auto;
       background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.6rem;box-shadow:0 6px 18px -16px rgba(0,0,0,.4)}
  .navwork{font-weight:700;color:var(--deep);font-size:1rem;padding:.3rem .4rem .5rem;cursor:pointer;border-bottom:1px solid var(--line);margin-bottom:.3rem}
  .chaps{display:flex;flex-direction:column}
  .chap{padding:.34rem .5rem;border-radius:8px;color:var(--ink2);text-decoration:none;font-size:.94rem;cursor:pointer;line-height:1.35}
  .chap:hover{background:var(--accent-soft);color:var(--accent)}
  .chap.on{background:var(--accent);color:var(--card);font-weight:600}
  .ctopics{display:flex;flex-direction:column;margin:.15rem 0 .35rem;padding-left:.3rem;border-left:2px solid var(--line)}
  .ct{color:var(--ink2);text-decoration:none;cursor:pointer;font-size:.85rem;line-height:1.3;padding:.16rem .4rem;border-radius:6px}
  .ct:hover{background:var(--accent-soft);color:var(--accent)}
  .ct.l0{font-weight:600;color:var(--deep)}
  .ct.l1{padding-left:.9rem}.ct.l2{padding-left:1.5rem;font-size:.82rem}.ct.l3{padding-left:2.1rem;font-size:.8rem;color:var(--ink3)}
  .reader{flex:1 1 auto;min-width:0;max-width:760px;margin-inline:auto}  /* cap line measure; center in leftover space */
  /* right-hand topics rail ("on this page") */
  .toc{position:sticky;top:60px;width:230px;flex:0 0 230px;max-height:calc(100vh - 76px);overflow:auto;
       background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.7rem;box-shadow:0 6px 18px -16px rgba(0,0,0,.4)}
  .toch{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:700;padding:.1rem .4rem .5rem;border-bottom:1px solid var(--line);margin-bottom:.35rem}
  .chtitle{font-size:1.5rem;font-weight:700;color:var(--deep);margin:.2rem 0 .1rem}
  .cmeta{color:var(--ink2);font-size:.85rem;margin-bottom:.8rem}
  .tnav{background:var(--gold-soft);border:1px solid var(--line);border-radius:10px;padding:.5rem .8rem;margin:0 0 1rem}
  .tnav .oi{padding:.1rem 0}
  /* export controls sit quietly above the chapter, and never print themselves */
  .ptools{display:flex;gap:.4rem;justify-content:flex-end;margin:0 0 .2rem}
  .pbtn{font:inherit;font-size:.76rem;letter-spacing:.03em;cursor:pointer;color:var(--ink2);
        background:transparent;border:1px solid var(--line);border-radius:6px;padding:.18rem .5rem}
  .pbtn:hover{color:var(--accent);border-color:var(--accent)}
  .pbtn.play{color:var(--accent);border-color:var(--line);margin-right:auto}
  .pbtn.play:hover{background:var(--accent-soft)}
  .pn{display:flex;justify-content:space-between;gap:1rem;margin:1.6rem 0 .5rem;border-top:1px solid var(--line);padding-top:1rem}
  .pn a{color:var(--accent);cursor:pointer;font-size:.95rem;max-width:46%}
  /* collapsible in-reader Topics panel — shown only when the right rail is hidden (phones/small tablets) */
  .toc-inline{display:none;background:var(--card);border:1px solid var(--line);border-radius:12px;
       padding:.2rem .7rem;margin:.2rem 0 1.1rem;box-shadow:0 6px 18px -16px rgba(0,0,0,.4)}
  .toc-inline>summary{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);
       font-weight:700;cursor:pointer;padding:.5rem .1rem;list-style:none}
  .toc-inline>summary::-webkit-details-marker{display:none}
  .toc-inline>summary::after{content:'▾';float:right;color:var(--ink2)}
  .toc-inline[open]>summary::after{content:'▴'}
  .toc-inline .ctopics{border-left:none;margin-top:0;padding-bottom:.4rem}
  /* ≤1000px: drop the right Topics rail → show the inline collapsible panel instead (fits iPad portrait rail at >1000) */
  @media(max-width:1000px){ .toc{display:none} .toc-inline{display:block} .reader{max-width:820px} }
  /* ≤820px: single column — nav becomes a short scrollable strip above the reader */
  @media(max-width:820px){ .layout{flex-direction:column} .reader{max-width:none;margin-inline:0}
    .nav{position:static;width:100%;flex:none;max-height:200px} }
  .v .ref{font-size:.72rem;color:var(--ink2);letter-spacing:.03em;margin-bottom:.15rem}
  .v .body{white-space:pre-wrap;font-size:var(--read)}
  /* verse layout: one pāda per line; extra room after a śloka ends */
  .verse{display:flex;flex-direction:column}
  .verse .pada{display:block}
  .verse .pe{margin-bottom:.55em}
  .verse .pada:last-child{margin-bottom:0}
  .head{font-weight:700;color:var(--deep);margin:1.2rem 0 .3rem;font-size:1.15rem}
  .sub{font-weight:600;color:var(--accent);margin:.8rem 0 .2rem}
  .colo{color:var(--ink2);font-style:italic;text-align:center;margin:.5rem 0}
  .hit{cursor:pointer}.hit b{color:var(--accent)}
  /* grantha-wise search scope selector */
  .scopebar{margin:.2rem 0 .6rem;text-align:center}
  .sscope{color:var(--ink2);font-size:.9rem;display:block;gap:1rem}
  .sscope-row{display:flex;align-items:center;gap:.5rem;margin-bottom:.8rem}
  .sscope-label{font-weight:500;color:var(--deep);min-width:130px}
  .work-select{font:inherit;font-size:.9rem;padding:.5rem;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--deep);flex:1;cursor:pointer}
  .sscope select{font:inherit;font-size:.9rem;padding:.2rem .4rem;border:1px solid var(--line);border-radius:7px;
                 background:var(--card);color:var(--deep);max-width:16em;vertical-align:middle}
  /* search pagination bar */
  .pager{display:flex;align-items:center;justify-content:center;gap:1rem;margin:.7rem 0;color:var(--ink2);font-size:.9rem}
  .pager button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--accent);
                border-radius:8px;padding:.35rem .8rem}
  .pager button:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}

  mark{background:#fce3a8;color:inherit;border-radius:3px;padding:0 .12em;box-shadow:0 0 0 1px #f0cf82 inset}

  #status{color:var(--ink2);padding:2rem;text-align:center}
  /* occurrence-walk bar (concept locator → step through loci) */
  #occbar{position:fixed;bottom:calc(1.1rem + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:30;display:flex;align-items:center;
          gap:.5rem;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:.4rem .55rem;
          box-shadow:0 8px 28px -10px rgba(0,0,0,.4);font-size:.9rem;max-width:92vw}
  #occbar span{color:var(--deep);font-weight:600;white-space:nowrap;padding:0 .2rem}
  #occbar button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--accent);
                 border-radius:16px;padding:.28rem .7rem}
  #occbar button:hover:not(:disabled){background:var(--accent-soft);border-color:var(--accent)}
  #occbar button:disabled{color:var(--ink2);opacity:.45;cursor:default}
  #occbar .occx{border:none;color:var(--ink2);padding:.28rem .45rem}
  /* ---- top-level tabs ----
     These are the two halves of the app — read the granthas, or study across them — and they
     used to be an h1 and a small chip crowded into the corner, which read as decoration
     rather than navigation. Now they are the widest thing in the bar after the title, carry
     the section name in Devanāgarī over a roman gloss, and show which half you are in. */
  .tabs{display:flex;gap:.35rem;align-items:stretch}
  .tab{display:flex;flex-direction:column;justify-content:center;text-decoration:none;
       padding:.3rem .95rem;border:1px solid var(--line);border-radius:10px;background:var(--card);
       color:var(--ink2);line-height:1.15;white-space:nowrap;transition:background .12s,border-color .12s}
  .tab b{font-family:var(--face);font-size:1.02rem;font-weight:600;color:inherit}
  .tab i{font-style:normal;font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;opacity:.7}
  .tab:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .tab.on{background:var(--accent);border-color:var(--accent);color:var(--card)}
  .tab.on i{opacity:.85}
  @media (max-width:560px){ .tab i{display:none} .tab{padding:.35rem .7rem} }
  /* ---- Anusandhāna (analytics) ---- */
  .anav{display:flex;gap:.4rem;flex-wrap:wrap;border-bottom:2px solid var(--line);margin:.2rem 0 1rem;padding-bottom:.5rem}
  .atab{text-decoration:none;color:var(--ink2);padding:.35rem .8rem;border-radius:8px;font-size:.95rem;white-space:nowrap}
  .atab:hover{background:var(--accent-soft);color:var(--accent)}
  .atab.on{background:var(--accent);color:var(--card);font-weight:600}
  /* ---- Anukramaṇikā (index) ---- */
  .ixen{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;opacity:.65}
  .ixkeys{display:flex;flex-wrap:wrap;gap:.3rem;margin:0 0 .9rem}
  .ixk{display:inline-flex;align-items:baseline;gap:.25rem;text-decoration:none;color:var(--ink2);
       border:1px solid var(--line);border-radius:8px;padding:.2rem .55rem;font-size:1rem;background:var(--card)}
  .ixk em{font-style:normal;font-size:.7rem;color:var(--ink3)}
  .ixk:hover{border-color:var(--accent);color:var(--accent)}
  .ixk.on{background:var(--accent);border-color:var(--accent);color:var(--card)}
  .ixk.on em{color:var(--card);opacity:.8}
  .ixcount{font-size:.8rem;color:var(--ink3);margin:0 0 .5rem;letter-spacing:.03em}
  /* two columns like a printed index; one column on narrow screens */
  .ixlist{columns:2;column-gap:2.2rem}
  @media (max-width:820px){ .ixlist{columns:1} }
  .ixrow{break-inside:avoid;display:flex;gap:.5rem;align-items:baseline;padding:.16rem 0;
         border-bottom:1px dotted var(--line-2)}
  .ixp{text-decoration:none;color:var(--ink);flex:1 1 auto}
  .ixp:hover{color:var(--accent)}
  .ixw{font-size:.74rem;color:var(--gold);white-space:nowrap}
  .ixn{font-size:.8rem;color:var(--gold);min-width:3.4em;white-space:nowrap}
  .anu .lead{color:var(--ink);margin:.2rem 0 .9rem;font-size:.98rem;line-height:1.6}
  .anu .lead a{color:var(--accent)} .anu .muted{color:var(--ink2);font-size:.9em}
  .cinput{width:100%;font:inherit;padding:.5rem .7rem;border:1px solid var(--line);border-radius:9px;background:var(--card);margin-bottom:.7rem}
  .chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1rem}
  .chip{font:inherit;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:.28rem .7rem;color:var(--deep);display:flex;gap:.35rem;align-items:baseline}
  .chip:hover{border-color:var(--accent);background:var(--accent-soft)}
  .chip span{font-size:.72rem;color:var(--ink2)}
  .cgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:1.6rem;align-items:start}
  @media(max-width:820px){.cgrid{grid-template-columns:1fr}}
  .chd{font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);font-weight:700;margin:1rem 0 .4rem;border-bottom:1px solid var(--line);padding-bottom:.25rem}
  .cstat{font-size:1.02rem;color:var(--deep);font-weight:600;margin:.3rem 0 .5rem}
  .catlabel{display:flex;align-items:center;gap:.4rem;font-size:.8rem;font-weight:700;color:var(--deep);
            margin:.8rem 0 .25rem;padding-bottom:.2rem;border-bottom:1px dashed var(--line)}
  .catlabel span{margin-left:auto;color:var(--ink2);font-weight:400;font-size:.9em}
  .hrow{display:flex;align-items:center;gap:.6rem;text-decoration:none;color:var(--ink);padding:.16rem .2rem;border-radius:6px}
  .hrow:hover{background:var(--accent-soft)}
  .hrow .hn{flex:0 0 42%;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:.35rem}
  .hrow .hbar{flex:1;height:12px;background:var(--line-2);border-radius:6px;overflow:hidden}
  .hrow .hbar i{display:block;height:100%;background:var(--accent);border-radius:6px}
  .hrow .hc{flex:0 0 auto;font-size:.82rem;color:var(--ink2);min-width:2.4em;text-align:right}
  .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .tpc{display:flex;justify-content:space-between;gap:1rem;text-decoration:none;color:var(--deep);padding:.22rem .3rem;border-radius:6px;border-left:3px solid var(--gold);background:var(--gold-soft);margin:.2rem 0}
  .tpc:hover{background:var(--gold-soft)} .tpc span{color:var(--ink2);font-size:.8rem;white-space:nowrap}
  .citerow{display:flex;gap:.6rem;align-items:baseline;text-decoration:none;padding:.2rem .3rem;border-radius:6px}
  .citerow:hover{background:var(--accent-soft)} .cref{color:var(--deep);font-weight:600;font-size:.9rem;flex:0 0 6.5em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cq{flex:1;color:var(--cite);font-style:italic;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .viatag{color:var(--gold);font-style:normal;font-weight:700;margin-left:.3rem;cursor:help}
  .xbtn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--accent);border-radius:7px;
        padding:.15rem .5rem;font-size:.8rem;margin-left:.5rem;vertical-align:middle}
  .xbtn:hover{background:var(--accent-soft);border-color:var(--accent)}
  .wtags{display:flex;flex-wrap:wrap;gap:.35rem;margin:.3rem 0 .7rem}
  .wtag{font-size:.78rem;background:var(--gold-soft);border-radius:12px;padding:.15rem .55rem;color:var(--gold)}
  .tmsvg,.netsvg{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:.5rem}
  .tmsvg text,.netsvg text{pointer-events:none;font-family:var(--face)}
  .wcloud{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1.2rem;line-height:2.1;text-align:center;margin:.5rem 0 1rem}
  .cw{text-decoration:none;color:var(--deep);white-space:nowrap;margin:0 .25em}
  .cw:hover{color:var(--accent);text-decoration:underline}
  .collos{display:flex;flex-wrap:wrap;gap:.4rem}
  .collo{display:flex;gap:.4rem;align-items:baseline;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.25rem .6rem;color:var(--deep)}
  .collo:hover{border-color:var(--accent)} .collo i{color:var(--ink2);font-size:.8rem;font-style:normal}
  .v.flash{animation:flashv 1.6s ease-out}
  @keyframes flashv{0%{background:#fce3a8;box-shadow:0 0 0 3px #f0cf82}100%{background:var(--card);box-shadow:none}}
/* audio + karaoke (Bhāgavatam-style: .ln spans, .now = currently recited line) */
.audio{margin:.6rem 0 .2rem;border-top:1px solid rgba(0,0,0,.08);padding-top:.5rem}
.apart{display:block;margin:.35rem 0;padding:.35rem .5rem;border-radius:6px}
.apart.on{background:rgba(140,90,20,.07)}
.aplay{border:1px solid rgba(140,90,20,.35);background:var(--card);color:var(--gold);border-radius:50%;
  width:1.9rem;height:1.9rem;cursor:pointer;font-size:.8rem;line-height:1}
.alab{font-size:.78rem;color:var(--gold);margin-left:.5rem;letter-spacing:.02em}
/* For a work with audio these recited lines ARE the reading text — they replace the entry's
   raw body — so they must answer A−/A+ like .v .body does. They did not, which is why the
   reading-size control appeared to do nothing on every work that had been baked. */
/* The 2.4rem indent sets the recited lines under their play button on a wide screen. On a
   phone the tile is barely wider than the text, so the same indent eats a tenth of the line
   and throws the block off-centre — dropped below 640px, where the tile's own padding gives
   equal margins on both sides. */
.alines{margin:.4rem 0 0 2.4rem;line-height:1.85;font-size:var(--read)}
@media (max-width:640px){
  .alines{margin-left:0}
  .alines.gap{padding-left:0}
}
/* prose: clauses flow, each daṇḍa-terminated clause its own line */
.alines.gadya .ln{display:block}
.alines.sutra .ln{display:block;font-weight:600}
/* verse: one pāda per line. No left rule and no extra left padding — the rule plus the 2.4rem
   indent above it pushed every pāda right while the right edge kept only the tile's own
   padding, so on a phone the text sat visibly off-centre in its card. The pādas are already
   set apart by their colour and one-per-line layout; the stripe was doing nothing the reader
   needed and cost the symmetry. */
.alines.padya{margin-top:.5rem;margin-bottom:.5rem}
.alines.padya .ln{display:block;font-style:normal;color:var(--verse);letter-spacing:.01em}
/* lacuna: lost text. No audio, no seg, so it never lights — and it must not look
   clickable, because there is nothing to seek to. */
/* the ॐ that frames a sūtra is printed INLINE with the aphorism (ॐ … ॐ, one utterance),
   so there is no separate pranava line — the sūtra line simply stays lit while it sounds */


/* MŪLA tiles — the Gītā verses Madhva comments on, and the Bhāgavata verses streamed from
   the other bucket. Set in red so the scripture is never confused with the commentary on it. */
.apart.mula .alab{color:var(--deep)}
.apart.mula .aplay{border-color:var(--deep);color:var(--deep)}
.apart.mula .alines .ln{color:var(--deep)}
.apart.mula .alines .ln.now{background:none;color:var(--accent);font-weight:600}
.alines.gap{margin:.3rem 0;padding-left:1.1rem;opacity:.45}
.alines.gap .ln{display:block;cursor:default;letter-spacing:.35em;color:var(--ink3)}
.alines.gap .ln:hover{background:none}
.alines .ln{cursor:pointer;padding:0 .1rem;border-radius:3px;transition:background .15s,color .15s}
.alines .ln:hover{background:rgba(140,90,20,.08)}
.alines .ln.now{background:none;color:var(--accent);font-weight:600}
/* No dark theme exists: nothing redefines --bg or the body colours, so the page is cream
   in either system setting. A prefers-color-scheme block that only recoloured TEXT therefore
   put pale amber on cream paper — the yellow highlight. Removed. If a dark theme is wanted
   later it has to start from the background, not from the accents. */



  /* ── pārāyaṇa player ────────────────────────────────────────────────────────
     A fixed transport so recitation survives scrolling, and — the point of it — it plays
     ON through the work: when a track ends the next begins, so a whole pāda, adhyāya or
     grantha runs without touching anything. Line icons, not emoji: they inherit the text
     colour and render the same on every platform. */
  #nowbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:none;align-items:center;
    gap:.55rem;padding:.5rem .9rem;font-size:16px;
    background:var(--chrome);border-top:1px solid var(--line);
    box-shadow:0 -2px 16px rgba(70,50,20,.10);backdrop-filter:blur(6px)}
  #nowbar.on{display:flex}
  #nowbar button{font:inherit;background:transparent;border:none;cursor:pointer;color:var(--ink2);
    display:inline-flex;align-items:center;padding:.2rem .3rem;border-radius:6px}
  #nowbar button:hover{color:var(--accent)}
  #nowbar button svg{width:1.15rem;height:1.15rem}
  #nowbar #nbPlay{color:var(--accent)} #nowbar #nbPlay svg{width:1.45rem;height:1.45rem}
  #nowbar .nblab{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;color:var(--ink);font-size:.95em}
  #nowbar .nbt{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:.82em;white-space:nowrap}
  #nowbar input[type=range]{flex:1 1 140px;min-width:80px;accent-color:var(--accent);height:3px}
  #nowbar select{font:inherit;font-size:.82em;padding:.15rem .3rem;border:1px solid var(--line);
    border-radius:6px;background:var(--card);color:var(--ink2)}
  #nowbar .nbloop{font-size:.78em;letter-spacing:.04em;color:var(--ink3)}
  #nowbar .nbloop.on{color:var(--accent)}
  body.playing main{padding-bottom:4.2rem}
  @media(max-width:620px){ #nowbar .nblab{display:none} }
  /* ── print / save-as-PDF ────────────────────────────────────────────────────
     Printing is done by the BROWSER, not by a JS PDF library. jsPDF and pdfmake place
     glyphs without a shaping engine, so Devanagari conjuncts and mātrās come out broken —
     unacceptable for a critical edition. The browser prints through the system text stack,
     which shapes correctly, and every platform offers "Save as PDF" from its print dialog.
     #printroot is filled on demand with the chosen scope and removed afterwards. */
  #printroot{display:none}
  /* The content swap is applied at ALL media, not only inside @media print. The native print
     path (PrintManager / viewPrintFormatter) captures the WebView AS LAID OUT, so anything
     gated behind print media never takes effect there: #printroot stayed display:none and both
     PDF buttons produced whatever was on screen — identical output regardless of scope.
     Doing the swap on screen makes the printed document deterministic on every platform, and
     it is safe to be visible because printDoc() always clears `printing` afterwards (the
     native promise resolving, onafterprint on the web).
     #printroot must be EXCLUDED from the hide rule, not merely overridden after it:
     `display:none !important` beats a later `display:block` regardless of specificity, so the
     print container was being hidden along with everything else — a blank page. */
  body.printing>*:not(#printroot){display:none !important}
  body.printing>#printroot{display:block !important}
  @media print{
    @page{margin:18mm 16mm}
    #nowbar{display:none !important}
    body{background:var(--card);color:#000;font-size:11.5pt;line-height:1.7}
    .phead{font-size:16pt;font-weight:700;margin:0 0 2mm;color:#000}
    .psub{font-size:9pt;color:#444;margin:0 0 8mm;letter-spacing:.04em}
    .pchap{break-before:page}
    .pchap:first-of-type{break-before:auto}
    .ptitle{font-size:13pt;font-weight:700;margin:0 0 4mm;color:#000;
            border-bottom:.4pt solid #999;padding-bottom:1.5mm}
    /* the reading text: tiles carry it for any work with audio */
    #printroot .alines{margin:0 0 3mm 0;font-size:11.5pt;line-height:1.7}
    #printroot .alines .ln{display:block;color:#000;cursor:auto;padding:0}
    #printroot .alines.padya .ln{color:#000}
    #printroot .v{break-inside:avoid;margin:0 0 3mm}
    #printroot .v .body{color:#000;font-size:11.5pt}
    #printroot .v.mula .body{font-weight:700}
    #printroot .topic{color:#000;font-weight:700;margin:5mm 0 2mm;break-after:avoid}
    #printroot .colo{font-style:italic;color:#333;text-align:center;margin:3mm 0}
    #printroot .ref{font-size:8.5pt;color:#555}
    /* apparatus that means nothing on paper */
    .ptools{display:none !important}
    #printroot .aplay,#printroot .alab,#printroot .apart .aplay,
    #printroot .toc,#printroot .toc-inline,#printroot .pn,#printroot .ctopics{display:none !important}
    #printroot .pfoot{margin-top:10mm;padding-top:2mm;border-top:.4pt solid #bbb;
                      font-size:8pt;color:#666}
  }
</style>
